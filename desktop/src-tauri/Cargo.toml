[package]
name = "cctv-simulator-pro"
version = "0.1.0"
description = "CCTV Simülatör Pro masaüstü kabuğu"
authors = ["hkahraman92"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "cctv_simulator_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
