name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows: the app's Tcl/Tk + PyInstaller pain is Windows-specific, so is
    # the reportlab Segoe UI font path. Test where it ships.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff (bug-catching subset)
        run: python -m ruff check .

      - name: Byte-compile the whole package
        run: python -m compileall -q cctv_simulator

      - name: Unit tests (no network)
        run: python -m pytest -m "not network"

      - name: Headless CLI smoke test
        shell: bash
        run: |
          python - <<'PY'
          import json
          from dataclasses import asdict
          from cctv_simulator.models import CameraConfig, TargetPoint, DEFAULT_LEVELS
          data = {
              "version": "2.0",
              "cameras": [asdict(CameraConfig(name="Giris", focal_min_mm=4, focal_max_mm=16))],
              "target_point": asdict(TargetPoint(active=True)),
              "ppm_levels": [asdict(x) for x in DEFAULT_LEVELS],
              "lens_mode": "compare",
          }
          open("ci_plan.json", "w", encoding="utf-8").write(json.dumps(data, ensure_ascii=False))
          PY
          python -m cctv_simulator --project ci_plan.json --export csv,xlsx,pdf --out ci_out
          test -s ci_out/ci_plan.csv
          test -s ci_out/ci_plan.xlsx
          test -s ci_out/ci_plan.pdf

      - name: Mypy (non-blocking)
        continue-on-error: true
        run: python -m mypy || true

  build-exe:
    # Full PyInstaller build on a clean runner — no Norton/Avast to quarantine
    # the bootloader (see CLAUDE.md "Windows exe derlemesi", failure mode 4).
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: PyInstaller (onedir)
        run: python -m PyInstaller --noconfirm --clean cctv_simulator.spec

      - name: Show Tcl/Tk diagnostic
        if: always()
        shell: bash
        run: cat "build/tkinter-diagnostic.txt" || true

      - name: Smoke-run the frozen exe (headless import check)
        shell: bash
        run: |
          test -f "dist/CCTV Simulator/CCTV Simulator.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: cctv-simulator-windows
          path: dist/CCTV Simulator/
          retention-days: 14
